[project]
name = "investment-lab"
version = "0.1.0"
description = "Local AI-assisted investment research, screening, and backtesting skeleton."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.16.0",
    "altair>=5.0.0",
    "baostock>=0.8.9",
    "duckdb>=1.0.0",
    "efinance>=0.5.5",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pandas-market-calendars>=4.4.0",
    "plotly>=5.20.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "quantstats>=0.0.62",
    "rich>=13.7.0",
    "scipy>=1.12.0",
    "streamlit>=1.35.0",
    "typer>=0.12.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
vectorbt = ["vectorbt>=0.26.0"]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ui/投资研究台.py" = ["E402"]
"src/ui/pages/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
